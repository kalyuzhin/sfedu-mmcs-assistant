services:
  api:
    container_name: voice-assistant-mmcs-api
    build:
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - voice_assistant_mmcs_data:/backend
    command: [ "python3.12","main.py" ]
    networks:
      - default



networks:
  default:
    driver: bridge

volumes:
  voice_assistant_mmcs_data: { }